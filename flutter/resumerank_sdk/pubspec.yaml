name: resumerank_sdk
description: Official Dart/Flutter SDK for the ResumeRank Pro ATS API. Handles auth, retry, 202 polling, and error mapping.
version: 1.0.0
homepage: https://github.com/your-org/resumerank-pro

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  http: ^1.2.1
  meta: ^1.14.0
  retry: ^3.1.2

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  # SDK-only package, no assets
