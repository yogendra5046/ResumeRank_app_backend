[pytest]
addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    authentication: Authentication related tests
    authorization: Authorization related tests
    navigation: Navigation related tests
    ui_validation: UI Validation related tests
    forms: Form related tests
    crud: CRUD operations
    input_validation: Input Validation tests
    error_handling: Error Handling tests
    session: Session Management tests
    file_upload: File Upload tests
    accessibility: Accessibility tests
    responsive: Responsive Design tests
    performance: Performance Smoke tests
    regression: Regression tests
